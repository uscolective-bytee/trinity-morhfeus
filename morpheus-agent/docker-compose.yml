version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: morpheus-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - morpheus-api

  morpheus-api:
    build: .
    container_name: morpheus-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./morpheus.db:/app/morpheus.db
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: morpheus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  redis_data:
